[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "failurelab"
version = "0.1.0"
description = "FailureLab shared reliability experiment contracts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyJWT[crypto]==2.10.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
